name: Build release APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: data-dragon-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # On every push to main, publish a GitHub Release with the signed release APK
  # attached so it can be downloaded and installed directly from Releases.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: data-dragon-release-apk
          path: apk

      - name: Name the APK after this build
        run: |
          mkdir -p dist
          cp apk/*.apk "dist/data-dragon-release-build-${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Data Dragon build ${{ github.run_number }}
          body: >
            Automated signed **release** build from
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          files: dist/*.apk
          generate_release_notes: true
          prerelease: false

  # Recovery branch only. Publishes the rescue APK as a PRE-RELEASE so it can be
  # installed straight from the Releases page, without unpacking an Actions
  # artifact. Pinned to the rescue branch by name, so it can never fire on main
  # or on normal development — and the rescue branch is never merged, so this
  # job never reaches main either.
  recovery-prerelease:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/lifelogger-data-recovery-2e65d4'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: data-dragon-release-apk
          path: apk

      - name: Name the APK after this recovery build
        run: |
          mkdir -p dist
          cp apk/*.apk "dist/data-dragon-recovery-0.1.0-build-${{ github.run_number }}.apk"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recovery-build-${{ github.run_number }}
          name: Data Dragon Recovery build ${{ github.run_number }}
          body: |
            **Raw private-file recovery build — not the normal app.**

            versionCode 2, versionName `0.1.0-recovery`, applicationId
            `com.datadragon.app`, signed with the usual stable key, so it
            installs as an update over the currently installed build without
            uninstalling and without touching the private data directory.

            Launching it opens a single recovery screen, not the app. It never
            opens the database through Room or SQLite, runs no migration,
            checkpoint or vacuum, and deletes, renames and rewrites nothing. The
            one button copies the private app files into a ZIP you choose the
            location for, and writes a `RECOVERY_MANIFEST.txt` inventory beside
            them.

            Built from [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          files: dist/*.apk
          prerelease: true
