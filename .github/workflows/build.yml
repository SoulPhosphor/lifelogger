name: Build release APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check theme tokens
        run: python3 scripts/check_theme_tokens.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Room writes its schema to app/schemas while generating code. The
      # committed copy is deleted and regenerated (bypassing Gradle's caches),
      # so any difference, or a missing file, means a build-tool or library
      # change altered the stored database shape and needs a migration review.
      - name: Verify committed Room schema is unchanged
        if: success() || failure()
        run: |
          rm -rf app/schemas
          ./gradlew :app:kspDebugKotlin --rerun --stacktrace
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema export differs from the committed app/schemas files."
            git status --porcelain app/schemas
            git diff app/schemas
            git ls-files --others --exclude-standard app/schemas | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: Show generated test fixtures
        if: failure()
        run: |
          for f in app/build/generated-fixtures/*; do [ -f "$f" ] && { echo "== $f"; cat "$f"; echo; echo "== end $f"; }; done; true

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: data-dragon-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # On every push to main, publish a GitHub Release with the signed release APK
  # attached so it can be downloaded and installed directly from Releases.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: data-dragon-release-apk
          path: apk

      - name: Name the APK after this build
        run: |
          mkdir -p dist
          cp apk/*.apk "dist/data-dragon-release-build-${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Data Dragon build ${{ github.run_number }}
          body: >
            Automated signed **release** build from
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          files: dist/*.apk
          generate_release_notes: true
          prerelease: false
