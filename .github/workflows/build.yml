name: Build release APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: data-dragon-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # On every push to main, publish a GitHub Release with the signed release APK
  # attached so it can be downloaded and installed directly from Releases.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: data-dragon-release-apk
          path: apk

      - name: Name the APK after this build
        run: |
          mkdir -p dist
          cp apk/*.apk "dist/data-dragon-release-build-${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Data Dragon build ${{ github.run_number }}
          body: >
            Automated signed **release** build from
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          files: dist/*.apk
          generate_release_notes: true
          prerelease: false

  # Publishes this branch's build as a PRE-RELEASE so it can be installed from
  # the Releases page without merging to main. Pinned to this branch by name, so
  # it can never fire on main, and the main `release` job above is untouched.
  # Delete this job when the branch is merged.
  automatic-backup-prerelease:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/automatic-backup'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: data-dragon-release-apk
          path: apk

      - name: Name the APK after this build
        run: |
          mkdir -p dist
          cp apk/*.apk "dist/data-dragon-autobackup-build-${{ github.run_number }}.apk"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autobackup-build-${{ github.run_number }}
          name: Data Dragon Automatic Backup build ${{ github.run_number }}
          body: |
            **Automatic Backup — test build. Not merged to main.**

            versionCode 3, so it installs over the versionCode 2 recovery build
            and over any older build, without uninstalling and without touching
            existing data.

            Set it up in **Settings → Automatic Backup**: tap
            **Choose Backup Folder…**, pick where backups should go, then turn on
            **Back Up Every Day**. The first backup runs the next time the app is
            opened; after that, once a day. Four are kept.

            Backups are the same `.json` **Back Up All Data** writes, so
            **Restore from Backup** reads them with no special handling.

            Built from [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          files: dist/*.apk
          prerelease: true
